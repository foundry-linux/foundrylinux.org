name: Build .debs (PR)

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  audit-upstream-packaging:
    name: Audit changed upstream packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install archive readers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y unzip zstd

      - name: Check baseline inventory and changed upstreams
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          bash scripts/audit-upstream-packaging.sh --inventory-only

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          mapfile -t packages < <(
            git diff --name-only "$BASE_SHA" HEAD -- 'packages/*/build.sh' \
              | sed -n 's#^packages/\([^/]*\)/build\.sh$#\1#p'
          )
          if git diff --name-only "$BASE_SHA" HEAD -- scripts/build-rust-tool.sh | grep -q .; then
            packages+=(blender-asset-finder blender-asset-finder-cli)
          fi

          # xemu is the small positive control: every CI run proves that the
          # scanner still detects the .deb builder which prompted this guard.
          packages+=(xemu)
          mapfile -t packages < <(printf '%s\n' "${packages[@]}" | sort -u)
          bash scripts/audit-upstream-packaging.sh "${packages[@]}"

  build-debs:
    name: Build every metapackage with dpkg-deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install runner-side deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y shellcheck

      - name: shellcheck scripts
        run: |
          shellcheck scripts/*.sh
          find packages -name '*.sh' -exec shellcheck {} +

      - name: Build all .debs in ubuntu:26.04 (our distribution base)
        # .debs must be built against 26.04's libraries so dpkg-shlibdeps
        # resolves the correct sonames — see publish.yml for the full
        # rationale.
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:26.04 \
            bash -c '
              set -euo pipefail
              apt-get update -q
              apt-get install -y --no-install-recommends \
                build-essential debhelper dpkg-dev devscripts fakeroot lintian \
                zip python3 \
                curl ca-certificates pkg-config sudo
              bash scripts/build-all.sh
            '

      - name: Verify all .debs
        run: |
          set -euo pipefail
          for deb in dist/*.deb; do
            echo "=== $deb ==="
            dpkg-deb --info "$deb"
          done

      - name: Upload built .debs
        uses: actions/upload-artifact@v7
        with:
          name: foundry-apt-debs
          path: dist/*.deb
          retention-days: 14

  pipeline-tests:
    name: dist-cache fail-closed path + package-publish marker lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install runner-side deps (rclone for the local fake-bucket test, jq for the marker test)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rclone jq

      - name: Test scripts/dist-cache.sh hydrate/persist against a local fake bucket
        # No R2, no credentials — exercises the same rclone verbs/flags
        # publish.yml uses, against a local rclone remote.
        run: bash test/test-dist-cache.sh

      - name: Test the package-publish marker lifecycle
        # No wald3n.com, no network — task/curl are PATH-shimmed inside the
        # test itself.
        run: bash test/test-package-publish-marker.sh
